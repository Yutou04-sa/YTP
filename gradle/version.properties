# Single source of truth for the YTP release version.
#
# verCode : versionCode of the manager apk; the embedded framework (core) uses the same value
# verName : versionName; also used for the apk file name, YTP-v<verName>-release.apk
#
# Both the main build (HKP/build.gradle.kts) and the standalone core build
# (HKP/core/build.gradle.kts) read this file so their versions cannot drift apart.
verCode=7854
verName=2.2.0
