name: 安卓 CI

# 每次 push / PR 都构建管理器 APK。
# 推送版本标签（例如 `git tag v2.2.0 && git push ytp v2.2.0`）会以该标签发布一个 GitHub Release。
# 应用自身的 versionName/versionCode 定义在 gradle/version.properties 中，若标签与其中的
# `verName` 不一致，发布步骤会直接失败。

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # 标签构建需要创建 Release

jobs:
  build:
    name: 构建
    runs-on: ubuntu-latest
    env:
      # 可选的签名材料。仓库配置了这些 secret 时，APK 会用与本地构建相同的密钥签名；
      # 没有配置（例如别人 fork 之后）则这些变量为空，manager/build.gradle.kts 会回退为
      # 未签名发布，因此工作流零配置也能跑通。
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      # 可选：期望的签名证书 SHA-256。与签名 secret 同时设置时，构建会拒绝发布由其他密钥
      # 签名的 APK。
      SIGNING_CERT_SHA256: ${{ secrets.SIGNING_CERT_SHA256 }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          # lsplant 会从 git 历史（最近的 tag）推导自身版本号，所以浅克隆不够。
          fetch-depth: 0

      - name: 配置 Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4

      - name: 安装 SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;29.0.13113456"
          # build.gradle.kts 要求 "3.29.8+" 并会挑已安装的最新版本，所以只要这个确切包拿不到，
          # 用运行器预装的 cmake 也可以接受。
          sdkmanager --install "cmake;3.31.6" || echo "::warning::cmake;3.31.6 was not installed by sdkmanager"

      - name: 升级 Ninja（C++20 modules 需要 Ninja >= 1.11）
        # Android SDK 的 cmake 包自带旧版 ninja（运行器上是 1.10.2），而 AGP 会把它作为
        # CMAKE_MAKE_PROGRAM 显式传给 CMake，所以只把新版 ninja 放到 PATH 里没用：
        # lsplant / dex_builder 使用 C++20 modules，CMake 在 Ninja < 1.11 时拒绝生成。
        # 因此直接覆盖每个已安装 cmake 包里的那个二进制。
        run: |
          set -euo pipefail
          curl -sSLo ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-linux.zip
          # 固定校验和，防止上游资源被替换后往发布构建里塞二进制。
          echo "6f98805688d19672bd699fbbfa2c2cf0fc054ac3df1f0e6a47664d963d530255  ninja.zip" | sha256sum -c -
          unzip -q ninja.zip
          chmod +x ninja
          sudo cp ninja /usr/local/bin/ninja
          for d in "$ANDROID_HOME"/cmake/*/bin; do
            if [ -d "$d" ]; then sudo cp ninja "$d/ninja"; fi
          done
          ninja --version
          "$ANDROID_HOME"/cmake/*/bin/ninja --version

      - name: 写入签名材料
        # 缺少 secret 时整步跳过，release 保持未签名。
        # KEY_ALIAS 是唯一按字面写入的项（这里的 Java .properties 转义会按 UTF-8 读，
        # 所以直接写非 ASCII 别名有风险）。
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          mkdir -p manager/signing
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > manager/signing/ytp-signing.jks
          cat > manager/signing/signing.properties <<EOF
          KEYSTORE_FILE=manager/signing/ytp-signing.jks
          KEYSTORE_PASSWORD=${SIGNING_STORE_PASSWORD}
          KEY_ALIAS=\u9c7c\u5b50
          KEY_PASSWORD=${SIGNING_KEY_PASSWORD}
          EOF
          ls -l manager/signing

      - name: 构建 release APK
        run: ./gradlew :manager:buildRelease --console=plain --stacktrace

      - name: 校验 APK 签名
        # 绝不发布签名者不符合预期的 APK：release 的可信度等同于给它签名的证书。
        # 把 SIGNING_CERT_SHA256 secret 设为期望的证书 SHA-256（apksigner 输出的
        # "certificate SHA-256 digest" 一行，build-tools 37 会写成
        # "V3.0 Signer: certificate SHA-256 digest: …"）即可让这一步变成强制校验。
        # 没有配置签名 secret 时 release 本就未签名，此步只报告该事实。
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          for apk in out/release/*.apk; do
            echo "== $apk"
            report="$RUNNER_TEMP/apksigner-$(basename "$apk").txt"
            if ! "$apksigner" verify --verbose --print-certs --min-sdk-version 24 "$apk" > "$report" 2>&1; then
              cat "$report"
              if [ -n "${SIGNING_KEYSTORE_BASE64:-}" ]; then
                echo "::error::$apk failed apksigner verification"
                exit 1
              fi
              echo "::notice::$apk is not signed (no signing secrets configured)"
              continue
            fi
            grep -i "certificate SHA-256 digest" "$report" || true
            # build-tools 37 会在摘要行前加上签名方案（"V3.0 Signer:"），旧版本写的是
            # "Signer #1"，所以这里只按摘要名称匹配，不依赖前缀。
            actual=$(grep -i "certificate SHA-256 digest" "$report" | head -n 1 | awk '{print $NF}' | tr -d ':\r' | tr 'A-F' 'a-f')
            if [ -n "${SIGNING_KEYSTORE_BASE64:-}" ]; then
              if [ -z "$actual" ]; then
                echo "::error::could not read the certificate SHA-256 digest of $apk from the apksigner report"
                cat "$report"
                exit 1
              fi
              if [ -z "${SIGNING_CERT_SHA256:-}" ]; then
                echo "::warning::SIGNING_CERT_SHA256 is not set, the signer of $apk was not verified"
              else
                expected=$(echo "${SIGNING_CERT_SHA256}" | tr -d ':' | tr 'A-F' 'a-f')
                if [ "$actual" != "$expected" ]; then
                  echo "::error::$apk is signed by ${actual}, expected ${expected}"
                  exit 1
                fi
                echo "::notice::$apk is signed by ${actual}"
              fi
            fi
          done

      - name: 生成校验和
        run: |
          set -euo pipefail
          (cd out/release && sha256sum *.apk | tee SHA256SUMS.txt)

      - name: 上传 APK
        uses: actions/upload-artifact@v7
        with:
          name: YTP-apk-${{ github.sha }}
          path: |
            out/release/*.apk
            out/release/SHA256SUMS.txt
            manager/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 仅标签构建：附上本次运行产出的 APK。重跑工作流会替换该 Release，
      # 而不是再追加一套资产。
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          # tag 与包内版本号允许不同：tag 是发布标识，versionName/versionCode 由
          # gradle/version.properties 固定。两者都会写进 Release 说明，便于对照。
          fileVer=$(grep -E '^verName=' gradle/version.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "$ver" != "$fileVer" ]; then
            echo "::warning::tag ${TAG} does not match gradle/version.properties (verName=${fileVer}); the release keeps the tag name and reports the APK version in its notes"
          fi
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" \
            --latest \
            --title "YTP ${ver}" \
            --notes "本构建由 [run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) 自动生成。

          发布 tag：${TAG}；APK 内版本号：verName=${fileVer}（versionCode 见 gradle/version.properties）。

          源码地址：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY} —— YTP 是 LSPatch 的二次修改版本（经由 HKP / HkPatch）：框架核心来自 LSPosed，免 Root 打补丁的思路来自 LSPatch / Xpatch，整体以 GPL-3.0 授权；第三方组件声明见仓库中的 NOTICE。" \
            out/release/*.apk out/release/SHA256SUMS.txt
