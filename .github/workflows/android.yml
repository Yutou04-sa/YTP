name: Android CI

# 每次 push / PR 都构建管理器 APK。
# 推送版本标签（例如 `git tag v2.2.0 && git push ytp v2.2.0`）会以该标签发布一个 GitHub Release。
# 应用自身的 versionName/versionCode 定义在 gradle/version.properties 中，若标签与其中的
# `verName` 不一致，发布步骤会直接失败。

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # 标签构建需要创建 Release

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # 可选的签名材料。仓库配置了这些 secret 时，APK 会用与本地构建相同的密钥签名；
      # 没有配置（例如别人 fork 之后）则这些变量为空，manager/build.gradle.kts 会回退为
      # 未签名发布，因此工作流零配置也能跑通。
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      # 可选：期望的签名证书 SHA-256。与签名 secret 同时设置时，构建会拒绝发布由其他密钥
      # 签名的 APK。
      SIGNING_CERT_SHA256: ${{ secrets.SIGNING_CERT_SHA256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # lsplant 会从 git 历史（最近的 tag）推导自身版本号，所以浅克隆不够。
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;29.0.13113456"
          # build.gradle.kts 要求 "3.29.8+" 并会挑已安装的最新版本，所以只要这个确切包拿不到，
          # 用运行器预装的 cmake 也可以接受。
          sdkmanager --install "cmake;3.31.6" || echo "::warning::cmake;3.31.6 was not installed by sdkmanager"

      - name: Upgrade Ninja (C++20 modules need Ninja >= 1.11)
        # Android SDK 的 cmake 包自带旧版 ninja（运行器上是 1.10.2），而 AGP 会把它作为
        # CMAKE_MAKE_PROGRAM 显式传给 CMake，所以只把新版 ninja 放到 PATH 里没用：
        # lsplant / dex_builder 使用 C++20 modules，CMake 在 Ninja < 1.11 时拒绝生成。
        # 因此直接覆盖每个已安装 cmake 包里的那个二进制。
        run: |
          set -euo pipefail
          curl -sSLo ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-linux.zip
          # 固定校验和，防止上游资源被替换后往发布构建里塞二进制。
          echo "6f98805688d19672bd699fbbfa2c2cf0fc054ac3df1f0e6a47664d963d530255  ninja.zip" | sha256sum -c -
          unzip -q ninja.zip
          chmod +x ninja
          sudo cp ninja /usr/local/bin/ninja
          for d in "$ANDROID_HOME"/cmake/*/bin; do
            if [ -d "$d" ]; then sudo cp ninja "$d/ninja"; fi
          done
          ninja --version
          "$ANDROID_HOME"/cmake/*/bin/ninja --version

      - name: Write signing material
        # 缺少 secret 时整步跳过，release 保持未签名。
        # KEY_ALIAS 是唯一按字面写入的项（这里的 Java .properties 转义会按 UTF-8 读，
        # 所以直接写非 ASCII 别名有风险）。
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          mkdir -p manager/signing
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > manager/signing/ytp-signing.jks
          cat > manager/signing/signing.properties <<EOF
          KEYSTORE_FILE=manager/signing/ytp-signing.jks
          KEYSTORE_PASSWORD=${SIGNING_STORE_PASSWORD}
          KEY_ALIAS=\u9c7c\u5b50
          KEY_PASSWORD=${SIGNING_KEY_PASSWORD}
          EOF
          ls -l manager/signing

      - name: Build release APK
        run: ./gradlew :manager:buildRelease --console=plain --stacktrace

      - name: Verify the apk signature
        # 绝不发布签名者不符合预期的 APK：release 的可信度等同于给它签名的证书。
        # 把 SIGNING_CERT_SHA256 secret 设为期望的 "Signer #1 certificate SHA-256 digest"
        # 即可让这一步变成强制校验。没有配置签名 secret 时 release 本就未签名，此步只报告该事实。
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          for apk in out/release/*.apk; do
            echo "== $apk"
            report="$RUNNER_TEMP/apksigner-$(basename "$apk").txt"
            if ! "$apksigner" verify --verbose --print-certs "$apk" > "$report" 2>&1; then
              cat "$report"
              if [ -n "${SIGNING_KEYSTORE_BASE64:-}" ]; then
                echo "::error::$apk failed apksigner verification"
                exit 1
              fi
              echo "::notice::$apk is not signed (no signing secrets configured)"
              continue
            fi
            grep -i "certificate SHA-256 digest" "$report" || true
            actual=$(grep -i "Signer #1 certificate SHA-256 digest" "$report" | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
            if [ -n "${SIGNING_KEYSTORE_BASE64:-}" ] && [ -n "${SIGNING_CERT_SHA256:-}" ]; then
              expected=$(echo "${SIGNING_CERT_SHA256}" | tr -d ':' | tr 'A-F' 'a-f')
              if [ "$actual" != "$expected" ]; then
                echo "::error::$apk is signed by ${actual}, expected ${expected}"
                exit 1
              fi
            elif [ -n "${SIGNING_KEYSTORE_BASE64:-}" ]; then
              echo "::warning::SIGNING_CERT_SHA256 is not set, the signer of $apk was not verified"
            fi
          done

      - name: Generate checksums
        run: |
          set -euo pipefail
          (cd out/release && sha256sum *.apk | tee SHA256SUMS.txt)

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: YTP-apk-${{ github.sha }}
          path: |
            out/release/*.apk
            out/release/SHA256SUMS.txt
            manager/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 仅标签构建：附上本次运行产出的 APK。重跑工作流会替换该 Release，
      # 而不是再追加一套资产。
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          # 标签必须等于 gradle/version.properties 中的版本号：应用自身的
          # versionName/versionCode 就来自该文件，标签不匹配就会发布一个版本号与 Release
          # 不一致的 APK。
          fileVer=$(grep -E '^verName=' gradle/version.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "$ver" != "$fileVer" ]; then
            echo "::error::tag ${TAG} does not match gradle/version.properties (verName=${fileVer})"
            exit 1
          fi
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" \
            --latest \
            --title "YTP ${ver}" \
            --notes "Automatically built by [run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          Source code: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY} — YTP is a modified version of LSPatch (via HKP/HkPatch), licensed under GPL-3.0." \
            out/release/*.apk out/release/SHA256SUMS.txt
