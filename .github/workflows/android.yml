name: Android CI

# Builds the manager APK on every push/PR.
# Pushing a version tag (e.g. `git tag v2.2.0 && git push ytp v2.2.0`) publishes a GitHub
# Release with that tag. The app's own versionName/versionCode live in gradle/version.properties
# and the release fails if the tag does not match `verName` there.

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # the tag build publishes a release

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # Optional signing material. When the repository defines these secrets the APK is
      # signed with the same key as the local builds; when they are absent (e.g. a fork)
      # the variables are empty and manager/build.gradle.kts falls back to an unsigned
      # release, so the workflow keeps working without any setup.
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      # Optional: SHA-256 of the expected signer certificate. When set together with the
      # signing secrets the build refuses to publish an apk signed by another key.
      SIGNING_CERT_SHA256: ${{ secrets.SIGNING_CERT_SHA256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # lsplant derives its own version from git history (latest tag), so a shallow clone
          # is not enough.
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;29.0.13113456"
          # build.gradle.kts asks for "3.29.8+" and picks the newest installed one, so a
          # preinstalled cmake is acceptable if this exact package is unavailable.
          sdkmanager --install "cmake;3.31.6" || echo "::warning::cmake;3.31.6 was not installed by sdkmanager"

      - name: Upgrade Ninja (C++20 modules need Ninja >= 1.11)
        # The Android SDK's cmake package ships an old ninja (1.10.2 on the runner) and AGP
        # passes it explicitly as CMAKE_MAKE_PROGRAM, so putting a newer ninja on PATH is not
        # enough: lsplant / dex_builder use C++20 modules, which CMake refuses to generate
        # with Ninja < 1.11. Overwrite the bundled binary in every installed cmake package.
        run: |
          set -euo pipefail
          curl -sSLo ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-linux.zip
          # Pinned so a replaced upstream asset cannot inject a binary into the release build.
          echo "6f98805688d19672bd699fbbfa2c2cf0fc054ac3df1f0e6a47664d963d530255  ninja.zip" | sha256sum -c -
          unzip -q ninja.zip
          chmod +x ninja
          sudo cp ninja /usr/local/bin/ninja
          for d in "$ANDROID_HOME"/cmake/*/bin; do
            if [ -d "$d" ]; then sudo cp ninja "$d/ninja"; fi
          done
          ninja --version
          "$ANDROID_HOME"/cmake/*/bin/ninja --version

      - name: Write signing material
        # Skipped when the secrets are missing, which leaves the release unsigned.
        # KEY_ALIAS is the one piece written literally (Java .properties escapes are
        # read as UTF-8 here, so a raw non-ASCII alias would be a gamble).
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          mkdir -p manager/signing
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > manager/signing/ytp-signing.jks
          cat > manager/signing/signing.properties <<EOF
          KEYSTORE_FILE=manager/signing/ytp-signing.jks
          KEYSTORE_PASSWORD=${SIGNING_STORE_PASSWORD}
          KEY_ALIAS=\u9c7c\u5b50
          KEY_PASSWORD=${SIGNING_KEY_PASSWORD}
          EOF
          ls -l manager/signing

      - name: Build release APK
        run: ./gradlew :manager:buildRelease --console=plain --stacktrace

      - name: Verify the apk signature
        # Never publish an apk whose signer we did not expect: the release is only as trustworthy
        # as the certificate it is signed with. Set the SIGNING_CERT_SHA256 secret to the expected
        # "Signer #1 certificate SHA-256 digest" to make the check mandatory. Without signing
        # secrets the release is unsigned and this step only reports that fact.
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          for apk in out/release/*.apk; do
            echo "== $apk"
            report="$RUNNER_TEMP/apksigner-$(basename "$apk").txt"
            if ! "$apksigner" verify --verbose --print-certs "$apk" > "$report" 2>&1; then
              cat "$report"
              if [ -n "${SIGNING_KEYSTORE_BASE64:-}" ]; then
                echo "::error::$apk failed apksigner verification"
                exit 1
              fi
              echo "::notice::$apk is not signed (no signing secrets configured)"
              continue
            fi
            grep -i "certificate SHA-256 digest" "$report" || true
            actual=$(grep -i "Signer #1 certificate SHA-256 digest" "$report" | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
            if [ -n "${SIGNING_KEYSTORE_BASE64:-}" ] && [ -n "${SIGNING_CERT_SHA256:-}" ]; then
              expected=$(echo "${SIGNING_CERT_SHA256}" | tr -d ':' | tr 'A-F' 'a-f')
              if [ "$actual" != "$expected" ]; then
                echo "::error::$apk is signed by ${actual}, expected ${expected}"
                exit 1
              fi
            elif [ -n "${SIGNING_KEYSTORE_BASE64:-}" ]; then
              echo "::warning::SIGNING_CERT_SHA256 is not set, the signer of $apk was not verified"
            fi
          done

      - name: Generate checksums
        run: |
          set -euo pipefail
          (cd out/release && sha256sum *.apk | tee SHA256SUMS.txt)

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: YTP-apk-${{ github.sha }}
          path: |
            out/release/*.apk
            out/release/SHA256SUMS.txt
            manager/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Tag build only: attach the APK this run produced. Re-running the workflow
      # replaces the release instead of appending a second set of assets.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          # The tag must be the version stored in gradle/version.properties: the app's own
          # versionName/versionCode come from that file, so a mismatching tag would publish an
          # apk labelled with a different version than the release.
          fileVer=$(grep -E '^verName=' gradle/version.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "$ver" != "$fileVer" ]; then
            echo "::error::tag ${TAG} does not match gradle/version.properties (verName=${fileVer})"
            exit 1
          fi
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" \
            --latest \
            --title "YTP ${ver}" \
            --notes "Automatically built by [run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})." \
            out/release/*.apk out/release/SHA256SUMS.txt
